name: Tests

on:
  push:
  pull_request:

jobs:
  mermaid:
    runs-on: ubuntu-latest
    # Parsing is fast, but keep a generous job backstop: check.sh also bounds each parse
    # (MERMAID_CHECK_TIMEOUT) so a wedged Node process fails fast rather than stalling the run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          # mermaid@12 is ESM and targets modern Node; 22 matches the CLI the skill documents.
          node-version: "22"
      - run: pip install pytest
      # Provision the pinned parser dependencies: mermaid@12.0.0 (what check.sh validates
      # against), jsdom (the DOM the parser needs), and the zenuml plugin (the one external
      # diagram the catalog documents). check.sh and mermaid-parse.mjs read them from
      # MERMAID_PARSE_NODE_MODULES, so there is no per-test install. Keep the pin in sync with
      # mermaid/scripts/check.sh.
      - name: Install pinned Mermaid 12.0.0 parser
        run: |
          mkdir -p "$RUNNER_TEMP/parse"
          cd "$RUNNER_TEMP/parse"
          npm init -y >/dev/null
          npm install --no-fund --no-audit --save-exact \
            mermaid@12.0.0 \
            jsdom \
            @mermaid-js/mermaid-zenuml@1.0.1
          node -e "const v=require(process.env.RUNNER_TEMP+'/parse/node_modules/mermaid/package.json').version; if(v!=='12.0.0'){console.error('expected mermaid 12.0.0, got '+v); process.exit(1)} console.log('mermaid '+v)"
          echo "MERMAID_PARSE_NODE_MODULES=$RUNNER_TEMP/parse/node_modules" >> "$GITHUB_ENV"
      - run: python3 -m pytest tests/ -q --durations=15
        working-directory: mermaid
        env:
          # Per-diagram parse bound; the whole-batch Node process gets this times the diagram
          # count, so a large but healthy builder batch is never killed for its size while a
          # wedged process is still bounded. The job's timeout-minutes is the hard backstop.
          MERMAID_CHECK_TIMEOUT: "60"
